<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela</title>
  </head>
  <body>
    <h1>Tabelas no HTML5:</h1>
    <!-- estrutura minima de uma tabela -->

    <table border="1">
      <tr>
        <td>Dado 1</td>
        <td>Dado 2</td>
        <td>Dado 3</td>
      </tr>
      <tr>
        <td>Dado 4</td>
        <td>Dado 5</td>
        <td>Dado 6</td>
      </tr>
    </table>
    <!-- br: break line (quebra linha) -->
    <br /><br /><br />
    <!-- exemplo de tabela completa (com  mesclagem) -->
    <table border="1">
      <caption>
        Vendas do mês
      </caption>
      <thead>
        <tr>
          <th>Produto</th>
          <th>Quantidade</th>
          <th>Valor</th>
        </tr>
      </thead>
      <!-- Corpo da tabela -->
      <tbody>
        <tr>
          <td rowspan="2">Mouse</td>
          <td>10</td>
          <td>R$ 500,00</td>
        </tr>
        <tr>
          <td>20</td>
          <td>R$ 1.000,00</td>
        </tr>
      </tbody>
      <!-- rodapé -->
      <tfoot>
        <tr>
          <!-- colspan mescla colunas -->
          <th colspan="2">Total:</th>
          <td>R$ 1.500,00</td>
        </tr>
      </tfoot>
    </table>
    <br /><br /><br />

    <!-- tabela completa com o atributo scope -->
    <table border="1">
      <caption>
        Notas dos alunos por disciplinas
      </caption>
      <thead>
        <tr>
          <th scope="col">Aluno</th>
          <th scope="col">Matematica</th>
          <th scope="col">Portugues</th>
          <th scope="col">Historia</th>
        </tr>
      </thead>
      <tbody>
        <!-- linha 1: ana -->
        <tr>
          <th scope="row">Ana</th>
          <td>8.5</td>
          <td>9.0</td>
          <td>7.5</td>
        </tr>
        <!-- linha 2: bruno -->
        <tr>
          <th scope="row">Bruno</th>
          <td>9.5</td>
          <td>10.0</td>
          <td>8.5</td>
        </tr>
        <!-- linha 3: carlos -->
        <tr>
          <th scope="row">Carlos</th>
          <td>9.0</td>
          <td>8.5</td>
          <td>8.0</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
